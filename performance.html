<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraQuant | Performance Metrics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Motor Gráfico ApexCharts para el Dashboard Dinámico -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: '#121212',
                        cyanAccent: '#00FFFF',
                    }
                }
            }
        }
    </script>
    <style>
        /* Personalización del Tooltip interactivo (la cajita que sigue tu mouse) */
        .apexcharts-tooltip {
            background: #ffffff !important;
            border: 1px solid #e5e7eb !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
            color: #111827 !important;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
            border-radius: 4px !important;
        }
        .apexcharts-tooltip-title {
            background: #f9fafb !important;
            border-bottom: 1px solid #e5e7eb !important;
            font-size: 10px !important;
            font-weight: bold !important;
            color: #4b5563 !important;
        }
    </style>
</head>
<!-- FONDO BLANCO INSTITUCIONAL: bg-gray-50 -->
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen selection:bg-charcoal selection:text-white">

    <!-- Navegación Superior (Oscura para conectar visualmente con la portada) -->
    <header class="bg-charcoal border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-8 h-8 border-2 border-cyanAccent rotate-45 flex items-center justify-center group-hover:bg-cyanAccent/10 transition">
                    <span class="text-xs font-mono font-bold text-cyanAccent -rotate-45">AQ</span>
                </div>
                <span class="text-xl font-bold tracking-tight text-white font-mono">Aura<span class="text-cyanAccent">Quant</span></span>
            </a>
            <a href="index.html" class="text-gray-400 hover:text-white font-mono text-xs tracking-widest flex items-center transition uppercase">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Return to Core System
            </a>
        </div>
    </header>

    <!-- Contenedor Principal del Dashboard Limpio -->
    <main class="max-w-6xl mx-auto px-6 py-12">
        
        <!-- Cabecera de la Sección -->
        <div class="mb-8">
            <div class="text-gray-400 text-[10px] font-mono tracking-widest uppercase mb-2 flex items-center">
                <span>// 02 · TRACK RECORD</span> 
            </div>
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                <h1 class="text-3xl md:text-5xl font-extrabold text-charcoal uppercase tracking-tight">Historical Performance Evolution</h1>
                
                <!-- Botones Interactivos (Modo Claro) -->
                <div class="flex space-x-2 bg-white p-1 border border-gray-200 rounded-md shadow-sm">
                    <button id="btn-june" onclick="updateDashboard('june')" class="px-6 py-2 text-gray-500 font-mono text-xs uppercase tracking-wider transition cursor-pointer rounded hover:bg-gray-50 border border-transparent">June 2026</button>
                    <button id="btn-july" onclick="updateDashboard('july')" class="px-6 py-2 bg-charcoal text-cyanAccent border border-charcoal font-mono text-xs uppercase tracking-wider transition cursor-pointer rounded shadow-md">July 2026</button>
                </div>
            </div>
        </div>

        <!-- Cuadrícula de 4 Métricas (Tarjetas Blancas con Sombra Suave) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white border border-gray-200 p-6 rounded-lg shadow-sm">
                <div class="text-gray-400 text-[10px] font-mono mb-3 uppercase tracking-widest">Net Return</div>
                <div id="metric-return" class="text-4xl font-bold text-charcoal font-mono">+6.19%</div>
            </div>
            <div class="bg-white border border-gray-200 p-6 rounded-lg shadow-sm">
                <div class="text-gray-400 text-[10px] font-mono mb-3 uppercase tracking-widest">Sharpe Ratio</div>
                <div id="metric-sharpe" class="text-4xl font-bold text-charcoal font-mono">3.08</div>
            </div>
            <div class="bg-white border border-gray-200 p-6 rounded-lg shadow-sm">
                <div class="text-gray-400 text-[10px] font-mono mb-3 uppercase tracking-widest">Max Drawdown</div>
                <div id="metric-drawdown" class="text-4xl font-bold text-red-600 font-mono">-1.42%</div>
            </div>
            <div class="bg-white border border-gray-200 p-6 rounded-lg shadow-sm">
                <div class="text-gray-400 text-[10px] font-mono mb-3 uppercase tracking-widest">Win Rate</div>
                <div id="metric-winrate" class="text-4xl font-bold text-charcoal font-mono">68.1%</div>
            </div>
        </div>

        <!-- Gráfico Interactivo ApexCharts en Contenedor Blanco -->
        <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm relative">
            <div class="flex justify-between items-center mb-2">
                <div class="text-gray-500 text-xs font-mono tracking-widest flex items-center">
                    <span class="w-2 h-2 bg-charcoal rounded-full mr-2"></span>
                    EQUITY CURVE - <span id="chart-month-label" class="ml-1 text-charcoal font-bold">JULY 2026</span>
                </div>
                <div class="text-gray-400 text-[10px] font-mono uppercase tracking-widest">
                    INDEX = 100
                </div>
            </div>
            
            <!-- Contenedor donde ApexCharts inyectará el gráfico -->
            <div id="interactive-chart" class="w-full h-80"></div>
        </div>
    </main>

    <!-- Footer Limpio -->
    <footer class="border-t border-gray-200 bg-white py-8 px-6 mt-12">
        <div class="max-w-4xl mx-auto text-center space-y-4">
            <p class="text-xs tracking-widest text-gray-400 font-mono uppercase">
                "We code. We calibrate. We control the chaos. We are Aura Quant."
            </p>
        </div>
    </footer>

    <!-- Lógica del Dashboard y Gráfico (Modo Claro) -->
    <script>
        const dashboardData = {
            june: { 
                ret: "+4.12%", sharpe: "2.15", dd: "-1.85%", win: "64.3%", label: "JUNE 2026",
                chartData: [99.5, 100.2, 98.8, 101.4, 102.1, 100.9, 103.5, 104.1]
            },
            july: { 
                ret: "+6.19%", sharpe: "3.08", dd: "-1.42%", win: "68.1%", label: "JULY 2026",
                chartData: [100.0, 101.2, 102.5, 101.8, 103.4787, 105.1, 104.2, 106.19]
            }
        };

        const chartOptions = {
            series: [{
                name: 'Index Value',
                data: dashboardData.july.chartData
            }],
            chart: {
                type: 'area',
                height: 320,
                fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                toolbar: { show: false },
                animations: { enabled: true, easing: 'easeinout', speed: 800 }
            },
            colors: ['#121212'], // Línea en gris carbón oscuro muy elegante
            fill: {
                type: 'gradient',
                gradient: { shadeIntensity: 1, opacityFrom: 0.25, opacityTo: 0.02, stops: [0, 90, 100] }
            },
            dataLabels: { enabled: false },
            stroke: { curve: 'smooth', width: 2.5 },
            xaxis: {
                categories: ['Day 1', 'Day 4', 'Day 7', 'Day 10', 'Day 15', 'Day 19', 'Day 24', 'Day 28'],
                labels: { style: { colors: '#6b7280', fontSize: '10px' } },
                axisBorder: { show: false },
                axisTicks: { show: false },
                tooltip: { enabled: false }
            },
            yaxis: {
                min: 98,
                max: 108,
                labels: { style: { colors: '#6b7280', fontSize: '10px' }, formatter: (value) => { return value.toFixed(0); } }
            },
            grid: {
                borderColor: '#f3f4f6',
                strokeDashArray: 3,
                xaxis: { lines: { show: true } },
                yaxis: { lines: { show: true } },
            },
            theme: { mode: 'light' },
            tooltip: {
                theme: 'light',
                y: { formatter: function (val) { return val.toFixed(6); } },
                marker: { show: false }
            }
        };

        const chart = new ApexCharts(document.querySelector("#interactive-chart"), chartOptions);
        chart.render();

        function updateDashboard(month) {
            const data = dashboardData[month];

            document.getElementById('metric-return').innerText = data.ret;
            document.getElementById('metric-sharpe').innerText = data.sharpe;
            document.getElementById('metric-drawdown').innerText = data.dd;
            document.getElementById('metric-winrate').innerText = data.win;
            document.getElementById('chart-month-label').innerText = data.label;

            chart.updateSeries([{
                name: 'Index Value',
                data: data.chartData
            }]);

            const btnJune = document.getElementById('btn-june');
            const btnJuly = document.getElementById('btn-july');
            
            const activeClass = "px-6 py-2 bg-charcoal text-cyanAccent border border-charcoal font-mono text-xs uppercase tracking-wider transition cursor-pointer rounded shadow-md";
            const inactiveClass = "px-6 py-2 text-gray-500 font-mono text-xs uppercase tracking-wider transition cursor-pointer rounded hover:bg-gray-50 border border-transparent";

            if(month === 'june') {
                btnJune.className = activeClass;
                btnJuly.className = inactiveClass;
            } else {
                btnJuly.className = activeClass;
                btnJune.className = inactiveClass;
            }
        }
    </script>
</body>
</html>
